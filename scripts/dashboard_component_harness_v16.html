<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard v16 Streamlit Harness</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc}section[data-testid="stMain"]{height:100vh;overflow-y:auto;overflow-x:hidden;background:#f8fafc}.shell{width:min(100% - 28px,1240px);margin:0 auto}iframe{display:block;width:100%;height:700px;border:0;background:#f8fafc}@media(max-width:700px){.shell{width:100%}}</style></head><body><section data-testid="stMain"><div class="shell"><iframe id="component" title="لوحة الطالب"></iframe></div></section><script>const DATA={name:'منير',grade:12,grade_label:'الثاني عشر',overall_pct:30,done:12,selected_total:40,xp:1250,allowed:['phys','chem'],physics_live:true,chemistry_live:true,stage_progress:{phys:[100,40,12,0],chem:[0,0,0,0]},unit_progress:{phys:30,chem:0}};const frame=document.getElementById('component');window.__heightEvents=[];window.__componentValues=[];window.__componentReady=false;function render(){frame.contentWindow.postMessage({type:'streamlit:render',args:{data:DATA,physics_zip:'UEsDBA==',chemistry_zip:'UEsDBA=='}},'*')}window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data)return;if(event.data.type==='streamlit:componentReady'){window.__componentReady=true;render()}if(event.data.type==='streamlit:setFrameHeight'){const height=Math.round(Number(event.data.height)||0);window.__heightEvents.push({height,time:performance.now()});frame.style.height=height+'px'}if(event.data.type==='streamlit:setComponentValue')window.__componentValues.push(event.data.value)});frame.src='/dashboard_component/index.html';</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding v16 Streamlit Harness</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc}section[data-testid="stMain"]{height:100vh;overflow-y:auto;overflow-x:hidden;background:#f8fafc}.shell{width:min(100% - 20px,1220px);margin:0 auto}iframe{display:block;width:100%;height:700px;border:0;background:#f8fafc}@media(max-width:700px){.shell{width:100%}}</style></head><body><section data-testid="stMain"><div class="shell"><iframe id="component" title="إنشاء الحساب"></iframe></div></section><script>const frame=document.getElementById('component');const DATA={profile:{name:'',grade:12,subjects:['phys','chem']},has_password:false,error:''};window.__heightEvents=[];window.__componentValues=[];window.__componentReady=false;function render(){frame.contentWindow.postMessage({type:'streamlit:render',args:{data:DATA}},'*')}window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data)return;if(event.data.type==='streamlit:componentReady'){window.__componentReady=true;render()}if(event.data.type==='streamlit:setFrameHeight'){const height=Math.round(Number(event.data.height)||0);window.__heightEvents.push({height,time:performance.now()});frame.style.height=height+'px'}if(event.data.type==='streamlit:setComponentValue')window.__componentValues.push(event.data.value)});frame.src='/onboarding_component/index.html';</script></body></html>
